<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
    }

    .form div {
        margin-bottom: 15px;
    }

    ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        font-weight: bold;
    }

    .submit button {
        width: 100%;
        padding: 10px;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .submit button:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>
    <div class="form">
        <div>
            <ul>name</ul>
            <input type="text" placeholder="enter your name">
        </div>

        <div>
            <ul>email</ul>
            <input type="email" placeholder="enter your email">
    
        </div>
        <div>
            <ul>password</ul>
            <input type="password" placeholder="enter your password">
        </div>


        <div class="submit">
            <button>submit</button>
        </div>
</div>
</body>

</html>
